name: Validate server source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'libs/hbb_common'
      - '.github/workflows/validate.yaml'

permissions:
  contents: read

jobs:
  check:
    name: Linux source and dependency check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Check server binaries
        run: cargo check --locked --bins
      - name: Upload resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-dependency-lock
          path: Cargo.lock
          retention-days: 7
